name: All Non-LLM Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test-all-no-llm:
    name: All Non-LLM Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl http://localhost:6333/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-timeout pytest-cov
      
      - name: Start server
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 15
        env:
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
          # No LLM keys needed - this pipeline only tests non-LLM features
          LLM_PROVIDER: openai
          OPENAI_API_KEY: dummy-key-not-used
          PERPLEXITY_API_KEY: dummy-key-not-used
          TEST_BASE_URL: http://localhost:8000
      
      - name: Wait for server
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 2; done' || true
          sleep 5
      
      - name: Run basic integration tests
        run: |
          pytest tests/integration/test_api_no_llm.py -v --tb=short
      
      - name: Run comprehensive integration tests
        run: |
          pytest tests/integration/test_api_comprehensive.py -v --tb=short
        continue-on-error: true
      
      - name: Run edge case tests
        run: |
          pytest tests/integration/test_edge_cases.py -v --tb=short
        continue-on-error: true
      
      - name: Run performance tests (quick subset)
        run: |
          pytest tests/integration/test_performance.py::TestResponseTime::test_health_endpoint_response_time \
                 tests/integration/test_performance.py::TestResponseTime::test_cache_stats_response_time \
                 -v -s --tb=short
        continue-on-error: true
        timeout-minutes: 10
      
      - name: Run feature tests (no LLM)
        run: |
          python3 test_features_python.py --skip-llm || true
        continue-on-error: true
      
      - name: Test API endpoints
        run: |
          ./test_all_features.sh || true
        continue-on-error: true
      
      - name: Generate test report
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Basic Integration Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/integration/test_api_no_llm.py -v --tb=no -q >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Comprehensive Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/integration/test_api_comprehensive.py -v --tb=no -q >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Edge Case Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/integration/test_edge_cases.py -v --tb=no -q >> $GITHUB_STEP_SUMMARY 2>&1 || true

